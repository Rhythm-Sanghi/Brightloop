services:
  postgres:
    container_name: brightloop-db
    image: postgres:16
    environment:
      POSTGRES_DB: brightloop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brightloop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
